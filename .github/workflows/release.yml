name: Publish Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build & Release Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Package Desktop Application
        run: npm run package -w apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            apps/desktop/dist-package/*.exe
            apps/desktop/dist-package/*.dmg
            apps/desktop/dist-package/*.AppImage
            apps/desktop/dist-package/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-server:
    name: Package & Release Server
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Package Server Bundle
        run: |
          mkdir -p dist-server/devsync-server
          # Copy server, shared packages, docker configuration, and setup guide
          cp -r apps/server dist-server/devsync-server/
          cp -r packages dist-server/devsync-server/
          cp -r tunnel dist-server/devsync-server/
          cp Caddyfile dist-server/devsync-server/
          cp docker-compose.yml dist-server/devsync-server/
          cp docker-compose.tunnel.yml dist-server/devsync-server/
          cp package.json dist-server/devsync-server/
          cp package-lock.json dist-server/devsync-server/
          cp .env.example dist-server/devsync-server/
          cp setup_guide.md dist-server/devsync-server/
          
          # Clean up node_modules and development caches in the copied directory
          rm -rf dist-server/devsync-server/apps/server/node_modules
          rm -rf dist-server/devsync-server/node_modules
          
          # Compress the bundle
          cd dist-server
          zip -r devsync-server.zip devsync-server
          cd ..

      - name: Upload Server Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-server/devsync-server.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
