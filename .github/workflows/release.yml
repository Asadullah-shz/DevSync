name: Publish Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Package Desktop Application
        run: npm run package -w apps/desktop -- --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            apps/desktop/dist-package/*.exe
            apps/desktop/dist-package/*.dmg
            apps/desktop/dist-package/*.AppImage
            apps/desktop/dist-package/*.zip
          if-no-files-found: warn

  build-server:
    name: Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Package Server Bundle
        run: |
          mkdir -p dist-server/devsync-server
          cp -r apps/server dist-server/devsync-server/
          cp -r packages dist-server/devsync-server/
          cp -r tunnel dist-server/devsync-server/
          cp Caddyfile dist-server/devsync-server/
          cp docker-compose.yml dist-server/devsync-server/
          cp docker-compose.tunnel.yml dist-server/devsync-server/
          cp package.json dist-server/devsync-server/
          cp package-lock.json dist-server/devsync-server/
          cp .env.example dist-server/devsync-server/
          cp setup_guide.md dist-server/devsync-server/
          
          rm -rf dist-server/devsync-server/apps/server/node_modules
          rm -rf dist-server/devsync-server/node_modules
          
          cd dist-server
          zip -r devsync-server.zip devsync-server
          cd ..

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: dist-server/devsync-server.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Directory
        run: mkdir -p release-assets

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-artifacts-*
          merge-multiple: true

      - name: Download Server Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-artifact
          path: release-assets

      - name: Upload All Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
